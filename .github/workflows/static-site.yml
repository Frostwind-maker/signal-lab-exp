name: Build standalone HTML site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s assets/plotly.min.js
          mkdir _site
          cp index.html app.js styles.css _site/
          cp -r assets _site/assets
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-lab-html
          path: _site
          if-no-files-found: error
